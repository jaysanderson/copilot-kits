app = "university-demo"
primary_region = "syd"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  FORWARDED_ALLOW_IPS = "*"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "insights_data"
  destination = "/data"
