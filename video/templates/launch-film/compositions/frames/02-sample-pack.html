        "#f02-label-" + i,

        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        at + 0.12
      );
    }
    for (var i = 0; i < CUES.length; i++) pop(i + 1, CUES[i]);

    // 2 · missing page: svg-path-draw traces the dashed empty fourth slot
    var maskPath = document.getElementById("f02-miss-mask-path");
    var missLen = 0;
    try { missLen = maskPath.getTotalLength(); } catch (e) { missLen = 0; }
    if (!missLen) missLen = 2 * (116.5 + 166.5);
    missLen = missLen * 1.05;
    maskPath.style.strokeDasharray = String(missLen);
    maskPath.style.strokeDashoffset = String(missLen);
    tl.to(maskPath, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 4.16);
    tl.to("#f02-miss-dash", { fillOpacity: 0.05, duration: 0.35, ease: "power1.out" }, 4.72);

    // 3 · out of order: the four numbered pages fan out after the card lands
    var FAN_ROT = [-7, -2.5, 2.5, 7];
    for (var f = 0; f < 4; f++) {
      tl.fromTo(
        "#f02-fan-" + (f + 1),
        { rotation: 0 },
        { rotation: FAN_ROT[f], duration: 0.55, ease: "power3.out" },
        5.4 + f * 0.06
      );
    }

    // 5 · Word file: DOCX word + text lines fill the outline
    tl.fromTo("#f02-doc-word", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.7);
    var docLines = document.querySelectorAll(".f02-doc-line");
    for (var l = 0; l < docLines.length; l++) {
      tl.fromTo(docLines[l], { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 7.85 + l * 0.08);
    }

    // 7 · scanner batch: the stack thickens on "seven applicants", pill lands on "28"
    var sheets = document.querySelectorAll(".f02-sheet");
    for (var s = 0; s < sheets.length; s++) {
      var k = sheets.length - s; // back-most sheet travels furthest
      tl.fromTo(
        sheets[s],
        { x: 0, y: 0 },
        { x: k * 3, y: -k * 3, duration: 0.45, ease: "power3.out" },
        10.97 + s * 0.05
      );
    }
    tl.fromTo(
      "#f02-pill",
      { scale: 0, opacity: 0, y: 6 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      12.85
    );

    /* ---------- Scene 3 (hold): subtle jitter on the pill (sine-wave-loop, onUpdate form) ---------- */
    var pill = document.getElementById("f02-pill");
    var IDLE_START = 13.45;
    var IDLE_DUR = DUR - P(IDLE_START);
    var PERIOD = 2.0;
    var CYCLES = IDLE_DUR / PERIOD;
    var phase = { p: 0 };
    tl.to(
      phase,
      {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function () {
          var sn = Math.sin(phase.p);
          gsap.set(pill, { y: sn * 2, scale: 1 + sn * 0.01 });
        }
      },
      IDLE_START
    );

    window.__timelines["02-sample-pack"] = tl;

      /* == RETIMED (tools_apply_retime.py) == beat walk == */
      /* Every registered beat moves to its remapped position. */
      (function () {
        var kids = tl.getChildren(false, true, true);
        if (!kids.length) throw new Error("retime: no children to reposition");
        var moved = 0, over = [];
        kids.forEach(function (c) {
          if (c.vars && c.vars.data === "pin") return;   /* already in new-take time */
          var s = c.startTime(), n = P(s);
          if (Math.abs(n - s) > 0.0005) { c.startTime(n); moved++; }
          /* Eyebrows share one zone, so at a fade boundary two of them smear. Hold
             any eyebrow until the 0.5s transition is done. */
          var tg = (c.targets ? c.targets() : []);
          var nm = tg.length ? ((tg[0].id || "") + " " + (tg[0].className || "")) : "";
          if (/-eyebrow(\s|$)/.test(nm) && c.startTime() < 0.52) {
            c.startTime(0.52);
          }
          if (c.startTime() + c.duration() > 15.882 + 0.02) {
            over.push(Math.round((c.startTime() + c.duration()) * 1000) / 1000);
          }
        });
        window.__retime = window.__retime || {};
        window.__retime["02-sample-pack"] = { beats: kids.length, moved: moved, overrun: over };
      })();

  })();
</script>
</template>
