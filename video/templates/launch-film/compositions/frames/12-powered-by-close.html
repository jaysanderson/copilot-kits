      var __KX = [0.0000, 0.0700, 0.5100, 0.8100, 1.6200, 1.7900, 2.5700, 2.9000, 3.3300, 3.4500, 3.5000, 4.2000, 4.6400, 4.8000, 5.1200, 5.8700, 8.8700, 9.5300, 9.8770];

      function Q(u) { return __pw(u, __KY, __KX); }   /* inverse: drivers run in new time,

    if (l3.textContent !== s.l3) l3.textContent = s.l3;
  }
  applyState(SEQUENCE[0]);

  var driver = { t: 0 };
  tl.to(driver, {
    t: DURATION,
    duration: DURATION,
    ease: "none",
    onUpdate: function () { applyState(stateAt(Q(driver.t))); }
  }, 0);

  // each landed state gets a 0.5s settle (opacity + a short rise) — the one move per state

  tl.fromTo("#f12-line-2", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, T_L2);
  tl.fromTo("#f12-line-3", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, T_L3);

  var RING_2 = RING_1 + RING_DRAW * 0.75;
  tl.fromTo("#f12-ring-inner", { strokeOpacity: 0.32 }, { strokeDashoffset: 0, strokeOpacity: 0.32, duration: RING_DRAW, ease: "power2.out" }, RING_1);
