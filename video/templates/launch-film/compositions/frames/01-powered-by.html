  /* Composition: this frame's content measured top gap vs bottom gap as
     bottom-heavy, leaving a dead band under it. The whole layer stack drops 120px -
     60% of the measured difference, since optical centre sits above true centre. The
     stage colour is pinned on #root so the strip the shift opens at the top is the
     same navy, not a hole. */
  #root { background: #00216B; }
  #root > *.pg-vshift-marker, #root > * {
    transform: translateY(120px);
    height: calc(100% - 120px);
  }

  /* Real Progress Sans - local files, names outside the HyperFrames alias map */
  @font-face { font-family: "ProgressSansDisplay"; src: url("assets/ProgressSansDisplayVF.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
  @font-face { font-family: "ProgressSansText"; src: url("assets/ProgressSansTextVF.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
  :root, #root { --pg-display: "ProgressSansDisplay", Arial, Helvetica, sans-serif; --pg-text: "ProgressSansText", Arial, Helvetica, sans-serif; }

  /* Blue Professional tokens (frame.md) */

    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;

    --f01-primary: #00B563;
    --f01-text: #FFFFFF;

    inset: 0;

    pointer-events: none;

  .f01-ring {
    fill: none;
    stroke: var(--f01-primary);
    stroke-width: 2;
    stroke-linecap: round;
    opacity: 0.1;

  /* eyebrow above the card */

  .f01-wordmark {
    display: block;
    width: 760px;
    height: auto;
  }

  /* title block: two h1 lines, fixed height so line 1 never shifts */
  .f01-title-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .f01-title {
    position: absolute;
    left: 0;

  .f01-line {

  .f01-line-2 {

      function __pw(t, X, Y) { if (t <= X[0]) return Y[0] + (t - X[0]); var n = X.length - 1;
        if (t >= X[n]) return Y[n] + (t - X[n]) * (Y[n] / X[n]); var lo = 0, hi = n;

        return Y[lo] + (t - X[lo]) / (X[hi] - X[lo]) * (Y[hi] - Y[lo]); }
      function P(t) { return __pw(t, __KX, __KY); }   /* old take time -> delivered take time */
      function Q(u) { return __pw(u, __KY, __KX); }   /* inverse: drivers run in new time,

      var DURATION = 11.796;  /* measured delivered take (was 12.608) */
