      tl.fromTo(state,
        { value: 0 },
        { value: pct, duration: COUNT_DUR, ease: COUNT_EASE,
          onUpdate: function () { numEl.textContent = String(Math.round(state.value)); } }, at);
      tl.fromTo("#f10-num-" + n,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, at);
      // suffix lands after the count
      tl.fromTo("#f10-suf-" + n,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, at + COUNT_DUR);
    });

    // "ninety-two to ninety-nine": bracket draws down the OVERALL column, then the label
    tl.fromTo("#f10-scope", { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.2);
    if (bracketMain) tl.to(bracketMain, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 6.4);
    if (bracketMid) tl.to(bracketMid, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 6.95);
    tl.fromTo("#f10-range",
      { opacity: 0, x: -10 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power1.out" }, 7.3);

    // ---- Scene 3 (9.4–13.2s): the three F1 1.00 cells tint positive with a drawn tick ----
    ticks.forEach(function (p, i) {
      var at = 9.4 + i * 0.35;
      tl.fromTo("#f10-f1-" + (i + 1),
        { color: MUTED },
        { color: POSITIVE, duration: 0.4, ease: "power1.out" }, at);
      if (p) tl.to(p, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, at);
    });
    // spring-pop the tag-pill beside the ticked column
    tl.fromTo("#f10-pill",
      { opacity: 0, scale: 0.6, y: -8 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.7)" }, 10.7);

    // ---- Scene 4 (13.2–end): "75" counts in at the right; eyebrow + body; hold ----
    var metricEl = document.querySelector("#f10-metric-num");
    var m = { value: 0 };
    var M_DUR = 1.6;
    tl.fromTo("#f10-metric-num",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "power1.out" }, 13.2);
    tl.fromTo(m,
      { value: 0 },
      { value: 75, duration: M_DUR, ease: COUNT_EASE,
        onUpdate: function () { metricEl.textContent = String(Math.round(m.value)); } }, 13.2);
    tl.fromTo("#f10-metric-num",
      { scale: 0.5 },
      { scale: 1, duration: M_DUR, ease: COUNT_EASE }, 13.2);
    tl.fromTo("#f10-metric-label",
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.6);
    tl.fromTo("#f10-metric-body",
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 14.6);

    window.__timelines[ID] = tl;

      /* == RETIMED (tools_apply_retime.py) == beat walk == */
      /* Every registered beat moves to its remapped position. */
      (function () {
        var kids = tl.getChildren(false, true, true);
        if (!kids.length) throw new Error("retime: no children to reposition");
        var moved = 0, over = [];
        kids.forEach(function (c) {
          if (c.vars && c.vars.data === "pin") return;   /* already in new-take time */
          var s = c.startTime(), n = P(s);
          if (Math.abs(n - s) > 0.0005) { c.startTime(n); moved++; }
          /* Eyebrows share one zone, so at a fade boundary two of them smear. Hold
             any eyebrow until the 0.5s transition is done. */
          var tg = (c.targets ? c.targets() : []);
          var nm = tg.length ? ((tg[0].id || "") + " " + (tg[0].className || "")) : "";
          if (/-eyebrow(\s|$)/.test(nm) && c.startTime() < 0.52) {
            c.startTime(0.52);
          }
          if (c.startTime() + c.duration() > 16.997 + 0.02) {
            over.push(Math.round((c.startTime() + c.duration()) * 1000) / 1000);
          }
        });
        window.__retime = window.__retime || {};
        window.__retime["10-measured"] = { beats: kids.length, moved: moved, overrun: over };
      })();

  })();
</script>
