    // Scene 4 — badges punctuate each card's top edge, then hold
    tl.fromTo("#f03-badge-page", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 14.25);
    tl.fromTo("#f03-badge-ocr", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 14.5);

    paint();
    window.__timelines["03-the-hard-page"] = tl;

      /* == RETIMED (tools_apply_retime.py) == beat walk == */
      /* Every registered beat moves to its remapped position. */
      (function () {
        var kids = tl.getChildren(false, true, true);
        if (!kids.length) throw new Error("retime: no children to reposition");
        var moved = 0, over = [];
        kids.forEach(function (c) {
          if (c.vars && c.vars.data === "pin") return;   /* already in new-take time */
          var s = c.startTime(), n = P(s);
          if (Math.abs(n - s) > 0.0005) { c.startTime(n); moved++; }
          /* Eyebrows share one zone, so at a fade boundary two of them smear. Hold
             any eyebrow until the 0.5s transition is done. */
          var tg = (c.targets ? c.targets() : []);
          var nm = tg.length ? ((tg[0].id || "") + " " + (tg[0].className || "")) : "";
          if (/-eyebrow(\s|$)/.test(nm) && c.startTime() < 0.52) {
            c.startTime(0.52);
          }
          if (c.startTime() + c.duration() > 15.557 + 0.02) {
            over.push(Math.round((c.startTime() + c.duration()) * 1000) / 1000);
          }
        });
        window.__retime = window.__retime || {};
        window.__retime["03-the-hard-page"] = { beats: kids.length, moved: moved, overrun: over };
      })();

  })();
</script>
