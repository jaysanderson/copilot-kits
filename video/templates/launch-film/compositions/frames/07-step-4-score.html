      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      at + 0.05);

    // No counting figure. The four per-check scores that used to animate here (0.94,
    // 0.95, 0.95, 0.90) were invented - the app publishes a confidence per FIELD and an
    // overall, never a score per check, and a deterministic checksum cannot score 0.94
    // at all. Row 1 now carries the app's own count of validation notes; rows 2 to 4
    // carry no number, because there is no real number to carry.
    tl.fromTo(value,
      { opacity: 0, x: 8 },
      { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
      at + 0.45);
  });

  /* ---------- Scene 3 (20.3s–end): split-highlight review row, then hold ---------- */

  // "Anything under seventy percent" — the highlight row appears at the bottom of the panel.
  tl.fromTo("#f07-review",
    { opacity: 0, x: -18 },
    { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
    20.8);
  // "70%" tints cobalt on the word.
  tl.fromTo("#f07-pct",
    { color: "#FFFFFF" },
    { color: COBALT, duration: 0.4, ease: "power2.out" },
    21.5);
  // "goes on a review list" — the consequence arrives after the threshold.
  tl.fromTo("#f07-review-tail",
    { opacity: 0, x: -12 },
    { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
    22.2);

  // Pin the registered duration to the packet's length (hold to the end, no exit).
  tl.set({}, { data: "pin" }, DUR);

  // The eyebrow had no entrance, so it was up during the incoming cross-fade,
  // over the outgoing frame's eyebrow. Same entrance as every other frame.
  tl.fromTo(".f07-eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.05);

      /* == RETIMED (tools_apply_retime.py) == beat walk == */
      /* Every registered beat moves to its remapped position. */
      (function () {
        var kids = tl.getChildren(false, true, true);
        if (!kids.length) throw new Error("retime: no children to reposition");
        var moved = 0, over = [];
        kids.forEach(function (c) {
          if (c.vars && c.vars.data === "pin") return;   /* already in new-take time */
          var s = c.startTime(), n = P(s);
          if (Math.abs(n - s) > 0.0005) { c.startTime(n); moved++; }
          /* Eyebrows share one zone, so at a fade boundary two of them smear. Hold
             any eyebrow until the 0.5s transition is done. */
          var tg = (c.targets ? c.targets() : []);
          var nm = tg.length ? ((tg[0].id || "") + " " + (tg[0].className || "")) : "";
          if (/-eyebrow(\s|$)/.test(nm) && c.startTime() < 0.52) {
            c.startTime(0.52);
          }
          if (c.startTime() + c.duration() > 25.960 + 0.02) {
            over.push(Math.round((c.startTime() + c.duration()) * 1000) / 1000);
          }
        });
        window.__retime = window.__retime || {};
        window.__retime["07-step-4-score"] = { beats: kids.length, moved: moved, overrun: over };
      })();

})();
</script>
