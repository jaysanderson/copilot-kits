<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Motif: named absences</title></head>
<body>
<template>
  <style>
    #na-root { position: absolute; inset: 0; overflow: hidden; }
    .na-reader { position: absolute; left: 300px; top: 420px; width: 300px; height: 200px;
      border-radius: 18px; border: 3px solid #008963; background: rgba(0, 54, 42, 0.42); }
    .na-chart { position: absolute; left: 1320px; top: 420px; width: 300px; height: 200px;
      border-radius: 12px; border: 3px solid #5E719F; background: rgba(0, 21, 73, 0.35); }
    .na-bar { position: absolute; bottom: 22px; width: 28px; border-radius: 4px 4px 0 0;
      background: #9FB0D0; transform-origin: 50% 100%; }
    .na-tool { position: absolute; left: 790px; top: 740px; width: 320px; height: 110px;
      border-radius: 11px; border: 3px solid #C9821F; background: rgba(201, 130, 31, 0.16); }
    .na-toollab { position: absolute; left: 790px; top: 862px; width: 320px;
      text-align: center; font-family: "ProgText", sans-serif; font-size: 34px; color: #E09A33; }
    /* a document carrying a line that is visibly DIFFERENT from the rest */
    .na-rpass { position: absolute; left: 26px; top: 112px; width: 248px; height: 22px;
      border-radius: 5px; background: #00B563; }
    .na-rbar { position: absolute; left: 26px; height: 10px; border-radius: 4px;
      background: #9FB0D0; }
    .na-tslot { position: absolute; top: 24px; width: 80px; height: 62px;
      border-radius: 7px; border: 2px solid #C9821F;
      background: rgba(201, 130, 31, 0.22); }
    .na-doc { position: absolute; left: 120px; top: 200px; width: 230px; height: 170px;
      border-radius: 11px; background: linear-gradient(175deg, #ffffff 0%, #e6ebf5 100%);
      box-shadow: 0 12px 28px rgba(0, 10, 40, 0.48); }
    .na-dbar { position: absolute; left: 20px; height: 8px; border-radius: 4px; background: #9FB0D0; }
    .na-inject { position: absolute; left: 20px; width: 186px; height: 14px; border-radius: 4px;
      background: #C9821F; box-shadow: 0 0 16px rgba(201, 130, 31, 0.7); }
    /* the badge where a figure would sit, with the numeral slot left explicitly empty */
    .na-badge { position: absolute; left: 820px; top: 300px; width: 260px; height: 92px;
      border-radius: 46px; background: #FFFFFF; box-shadow: 0 14px 34px rgba(0, 8, 40, 0.45); }
    .na-badgelab { position: absolute; left: 820px; top: 330px; width: 260px;
      text-align: center; font-family: "ProgText", sans-serif; font-size: 34px; color: #5E719F; }
    .na-numslot { position: absolute; left: 1096px; top: 316px; width: 92px; height: 60px;
      border-radius: 10px; border: 2px dashed #9FB0D0; }
    .na-lab { position: absolute; font-family: "ProgText", sans-serif; font-size: 34px;
      color: #9FB0D0; letter-spacing: 0.04em; }
    .na-nb { position: absolute; font-family: "ProgText", sans-serif; font-size: 32px;
      color: #9FB0D0; letter-spacing: 0.08em; }
    svg.na-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>

  <div id="na-root" data-composition-id="m-na" data-width="1920" data-height="1080"
       data-duration="9.6">
    <div id="na-stage" style="position:absolute; inset:0;" data-layout-allow-overflow>
      <div class="na-reader" id="na-reader"></div>
      <div class="na-tool" id="na-tool"></div>
      <div class="na-chart" id="na-chart"></div>
      <div class="na-toollab" id="na-toollab" data-var-text="naTool">Your tools</div>

      <div class="na-doc" id="na-doc">
        <!-- EMPTY-BY-DESIGN na-inject: the injected line itself, a bar -->
        <div class="na-inject" id="na-inject" style="top:96px;"></div>
      </div>
      <div class="na-lab" id="na-injlab" style="left:120px; top:384px;"
           data-var-text="naInjection">Prompt injection</div>

      <!-- EMPTY-BY-DESIGN na-badge: its label is a sibling so the ring can animate alone -->
      <div class="na-badge" id="na-badge"></div>
      <div class="na-badgelab" id="na-badgelab" data-var-text="naBadge">Well supported</div>
      <!-- EMPTY-BY-DESIGN na-numslot: an EMPTY numeral slot is the picture of "no accuracy
           percentage" - filling it would be the defect -->
      <div class="na-numslot" id="na-numslot"></div>

      <div class="na-nb" id="na-nb" style="left:880px; top:600px;"
           data-var-text="naNotBuilt">NOT BUILT</div>
      <div class="na-lab" id="na-blocker" style="left:812px; top:640px; font-size:32px;"
           data-var-text="naBlocker">Authentication</div>

      <svg class="na-svg" id="na-svg" viewBox="0 0 1920 1080" fill="none">
        <!-- the injected line travels WITH the passage into the tool block: it is not
             caught, which is exactly what "we claim no defence" looks like -->
        <path id="na-injpath" d="M 350 300 C 480 330, 520 440, 450 470" stroke="#C9821F" stroke-width="3"/>
        <path id="na-toolpath" d="M 450 620 C 470 700, 700 780, 790 790" stroke="#C9821F" stroke-width="3"/>
        <!-- the join that goes NOT BUILT (6 10, the reserved short dash - never call it
             "dotted": GRAMMAR rule 2 names the STATE  <!-- GRAMMAR-PROSE-OK: names the banned word to ban it -->, not the shape, and prose that
             drifts from the artwork is how the old 3 9 scale came back once already):
             the Retrieval Agent cannot query the chart today -->
        <path id="na-notbuilt" d="M 600 520 L 1320 520" stroke="#9FB0D0" stroke-width="5"
              stroke-dasharray="6 10"/>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      // EVENT CONSTANTS are the sa-use-cases b7 word events rebased to motif zero.
      const AT_INJECT = 2.07;   // "prompt injection"
      const AT_NOPCT  = 3.62;   // "no accuracy percentage"
      const AT_NODOMO = 6.81;   // "cannot query Domo today"

      // the reader has a passage inside it, and the tool block has tools: an empty
      // bordered box names nothing, and this beat is about what reaches WHICH thing
      (function () {
        const rd = document.getElementById("na-reader");
        const pass = document.createElement("div");
        pass.className = "na-rpass"; rd.appendChild(pass);
        for (let i = 0; i < 2; i++) {
          const b = document.createElement("div");
          b.className = "na-rbar"; b.style.top = (34 + i * 26) + "px";
          b.style.width = (150 + i * 40) + "px"; rd.appendChild(b);
        }
        const tl2 = document.getElementById("na-tool");
        for (let i = 0; i < 3; i++) {
          const t = document.createElement("div");
          t.className = "na-tslot"; t.style.left = (20 + i * 96) + "px";
          tl2.appendChild(t);
        }
      })();

      const doc = document.getElementById("na-doc");
      [36, 56, 76, 126, 146].forEach((t, i) => {
        const b = document.createElement("div");
        b.className = "na-dbar"; b.style.top = t + "px";
        b.style.width = (120 + ((i * 27) % 70)) + "px";
        doc.appendChild(b);
      });
      const chart = document.getElementById("na-chart");
      [62, 100, 48, 118, 80].forEach((h, i) => {
        const b = document.createElement("div");
        b.className = "na-bar"; b.style.left = (36 + i * 52) + "px";
        b.style.height = h + "px"; chart.appendChild(b);
      });

      const IP = document.getElementById("na-injpath");
      const TP = document.getElementById("na-toolpath");
      const DT = document.getElementById("na-notbuilt");
      const IPL = IP.getTotalLength(), TPL = TP.getTotalLength(), DTL = DT.getTotalLength();
      IP.setAttribute("stroke-dasharray", String(IPL));
      TP.setAttribute("stroke-dasharray", String(TPL));

      const tl = gsap.timeline({ paused: true, defaults: { duration: 0.6, ease: "power3.out" } });

      // ---- closed state
      ["#na-doc", "#na-injlab"].forEach((id) => gsap.set(id, { autoAlpha: 0, y: 20 }));
      gsap.set("#na-inject", { autoAlpha: 0, scaleX: 0.2, transformOrigin: "0% 50%" });
      [IP, TP].forEach((p, i) => gsap.set(p, { strokeDashoffset: i ? TPL : IPL, autoAlpha: 0 }));
      gsap.set(DT, { autoAlpha: 0 });
      ["#na-badge", "#na-badgelab", "#na-numslot"].forEach((id) =>
        gsap.set(id, { autoAlpha: 0, y: 16 }));
      ["#na-nb", "#na-blocker"].forEach((id) => gsap.set(id, { autoAlpha: 0 }));
      gsap.set("#na-tool", { autoAlpha: 0.5 });
      gsap.set("#na-toollab", { autoAlpha: 0.5 });
      gsap.set("#na-chart", { autoAlpha: 0.5 });

      // ---- three absences shown as three specific MECHANISMS failing, rather than three
      // sentences of hedging.

      // 1. prompt injection: a line visibly different from the rest travels with the
      // passage, through the reader, and into the ISV's tool block. Nothing catches it.
      tl.to("#na-doc", { autoAlpha: 1, y: 0, duration: 0.5 }, AT_INJECT - 0.8);
      tl.to("#na-inject", { autoAlpha: 1, scaleX: 1, duration: 0.5, ease: "power2.out" }, AT_INJECT);
      tl.to("#na-injlab", { autoAlpha: 1, y: 0, duration: 0.45 }, AT_INJECT + 0.2);
      tl.to(IP, { autoAlpha: 1, duration: 0.15 }, AT_INJECT + 0.35);
      tl.to(IP, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, AT_INJECT + 0.35);
      tl.to("#na-reader", { borderColor: "#C9821F", duration: 0.35 }, AT_INJECT + 0.85);
      tl.to("#na-reader", { borderColor: "#008963", duration: 0.5 }, AT_INJECT + 1.2);
      tl.to(TP, { autoAlpha: 1, duration: 0.15 }, AT_INJECT + 1.0);
      tl.to(TP, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, AT_INJECT + 1.0);
      tl.to("#na-tool", { autoAlpha: 1, borderColor: "#E09A33", duration: 0.4 }, AT_INJECT + 1.6);
      tl.to("#na-toollab", { autoAlpha: 1, duration: 0.4 }, AT_INJECT + 1.6);

      // 2. no accuracy percentage: a badge forms where a figure would sit, and resolves to
      // a QUALITATIVE mark with the numeral slot left as an explicit dashed outline. The
      // absence is the picture, and no numeral ever appears (B34 / Field Rule 5).
      tl.to("#na-badge", { autoAlpha: 1, y: 0, duration: 0.5 }, AT_NOPCT);
      tl.to("#na-numslot", { autoAlpha: 1, y: 0, duration: 0.45 }, AT_NOPCT + 0.25);
      tl.to("#na-badgelab", { autoAlpha: 1, y: 0, duration: 0.45 }, AT_NOPCT + 0.5);
      tl.to("#na-numslot", { borderColor: "#9FB0D0", duration: 0.7, ease: "sine.inOut",
                             yoyo: true, repeat: 3 }, AT_NOPCT + 0.8);

      // 3. cannot query Domo today: a join ATTEMPTS to draw and goes to the NOT BUILT
      //    stroke (6 10, the reserved short dash), taking the
      // grammar's NOT BUILT stroke, with its blocker named beside it. This closes the loop
      // opened in m-jy phase A, where a join first broke.
      tl.to(DT, { autoAlpha: 1, duration: 0.5 }, AT_NODOMO);
      tl.to("#na-chart", { autoAlpha: 1, duration: 0.5 }, AT_NODOMO + 0.1);
      tl.to("#na-nb", { autoAlpha: 1, duration: 0.4 }, AT_NODOMO + 0.45);
      tl.to("#na-blocker", { autoAlpha: 1, duration: 0.4 }, AT_NODOMO + 0.7);
      document.querySelectorAll("#na-chart .na-bar").forEach((b, i) => {
        tl.fromTo(b, { scaleY: 0.4 }, { scaleY: 1, duration: 0.5, ease: "power3.out" },
                  AT_NODOMO + 0.3 + i * 0.08);
      });

      // ---- never still
      tl.to("#na-stage", { scale: 1.012, transformOrigin: "50% 50%", duration: 3.4,
                           ease: "sine.inOut" }, AT_NOPCT);
      // No light sweep. It existed to keep frozen windows alive and two
      // independent viewers read it as a rendering artefact; the authored
      // interiors supply the motion now.
      tl.to("#na-inject", { opacity: 0.7, duration: 0.9, ease: "sine.inOut",
                            yoyo: true, repeat: 3 }, AT_NOPCT + 0.3);

      window.__timelines["m-na"] = tl;
    })();
  </script>
</template>
</body>
</html>
