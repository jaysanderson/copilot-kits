             10 9 is none of them, sitting between the 20 12 ISV BUILDS and 6 10 NOT BUILT
             scales and separable from neither. A viewer cannot measure a dasharray. They
             read "dashed" as one of the two non-available states, and this derivation is
             CONFIRMED, so both available readings were wrong. The dasharray is set from
             the path length at runtime purely to DRAW IT ON, then left solid. -->
        <path id="bd-deriv" d="M 1070 592 L 1192 606" stroke="#008963" stroke-width="3"/>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      // ---- PHASE WINDOWS
      //   /table       0.00 -  9.54   query in place is true of the table, not the answer
      //   /hybrid      9.54 - 25.99   the index crosses and rests; the documents' own
      //                                 position is left UNRESOLVED (grammar rule 6)
      //   /notclaimed 25.99 - 31.35   three named absences, stated and HELD to the end
      //   /modes      33.50 - 42.00   three panels (host-driven; NOT in sa-use-cases)
      // EVENT CONSTANTS are the sa-use-cases b5 word events rebased to motif zero.
      const AT_RESID   = 0.50;   // "Residency catches people"
      const AT_QIP     = 3.98;   // "Query in place"
      const AT_TABLE   = 6.07;   // "true of the table"
      const AT_ANSWER  = 8.23;   // "true of the answer"
      const AT_HYBRID  = 9.54;   // "In hybrid"
      const AT_UNRESOLVED = 14.80;  // "Whether the documents themselves stay with you"
      const AT_NOTTOLD = 18.76;  // "Progress has not told us"
      const AT_BUILT   = 11.24;  // "index built from them"
      const AT_RESTS   = 13.05;  // "rests in Progress's cloud"
      const AT_OCT     = 22.16;  // "eighth of October"
      const AT_NOPUB   = 24.23;  // "published nowhere"
      const AT_NOT0    = 25.99;  // "No on premises"
      const AT_NOT1    = 27.67;  // "No offline"
      const AT_NOT2    = 29.41;  // "No air gapped"
      // HOST-DRIVEN: the three-panel row. DO NOT LOWER BELOW 31.25 - see the guard
      // immediately below, which throws rather than letting the sibling film break
      // silently.
      const AT_MODES   = 33.50;
      // ---- CROSS-FILM GUARD, added 9 Oct 2026 after film-sa-usecases measured the
      // margin and found it thinner than "after that film has finished" sounds.
      // That film's m-bd clip ends at motif-local 30.85s and its last shot (B5c)
      // EXISTS TO SHOW the three NOT BUILT panels; AT_NOT2 fires at 29.41, only 1.44s
      // before its clip ends. The ghost clear below fires at AT_MODES - 0.4, so with
      // AT_MODES at 33.50 the margin is 2.25s - smaller than a single pacing
      // adjustment. If AT_MODES is ever pulled below 31.25 the clear crosses into
      // that film's B5c and its panels vanish mid-shot, which would look like a
      // defect in its film rather than a timing change in this one.
      const SIBLING_CLIP_END = 30.85;   // film-sa-usecases, measured not assumed
      if (AT_MODES - 0.4 < SIBLING_CLIP_END + 0.4) {
        throw new Error(
          "m-bd: AT_MODES=" + AT_MODES + " puts the notclaimed clear at " +
          (AT_MODES - 0.4).toFixed(2) + "s, inside film-sa-usecases' clip which ends " +
          "at " + SIBLING_CLIP_END + "s. Its B5c exists to show the NOT BUILT panels " +
          "and they would vanish mid-shot. Raise AT_MODES above " +
          (SIBLING_CLIP_END + 0.8).toFixed(2) + " or re-time that film's B5c first.");
      }

      // ghosted objects inside each unclaimed mode
      // The ghost objects are now STATIC markup in #bd-notclaimed - see .bd-gobj.

      const tbl = document.getElementById("bd-table");
      for (let i = 0; i < 5; i++) {
        const r = document.createElement("div");
        r.className = "bd-trow"; r.style.top = (34 + i * 64) + "px";
        r.style.width = (380 + ((i * 53) % 170)) + "px";
        tbl.appendChild(r);
      }
      const res = document.getElementById("bd-res");
      for (let i = 0; i < 4; i++) {
        const b = document.createElement("div");
        b.className = "bd-resbar"; b.style.top = (18 + i * 18) + "px";
        b.style.width = (82 + ((i * 23) % 40)) + "px";
        res.appendChild(b);
      }

      const QP = document.getElementById("bd-qpath");
      const QPL = QP.getTotalLength();
      QP.setAttribute("stroke-dasharray", String(QPL));
      const DV = document.getElementById("bd-deriv");
      const DVL = DV.getTotalLength();
      DV.setAttribute("stroke-dasharray", String(DVL));

      const tl = gsap.timeline({ paused: true, defaults: { duration: 0.6, ease: "power3.out" } });

      // ---- closed state
      ["#bd-hybridphase", "#bd-notclaimed", "#bd-modesphase"].forEach((id) =>
        gsap.set(id, { autoAlpha: 0 }));
      gsap.set("#bd-t-bnd", { autoAlpha: 0 });
      gsap.set("#bd-t-tab", { autoAlpha: 0 });
      gsap.set("#bd-table", { autoAlpha: 0, y: 18 });
      gsap.set(QP, { strokeDashoffset: QPL, autoAlpha: 0 });
      ["#bd-qip", "#bd-res", "#bd-reslab"].forEach((id) => gsap.set(id, { autoAlpha: 0 }));
      gsap.set("#bd-idx", { autoAlpha: 0 });
      gsap.set("#bd-corpus-q", { autoAlpha: 0, scale: 0.6,
                               transformOrigin: "50% 50%" });
      gsap.set("#bd-corpus-qlab", { autoAlpha: 0 });
      gsap.set("#bd-m1-q", { autoAlpha: 0, scale: 0.6,
                           transformOrigin: "50% 50%" });
      gsap.set("#bd-m1-qlab", { autoAlpha: 0 });
      gsap.set("#bd-inf", { autoAlpha: 0 });
      gsap.set("#bd-date", { autoAlpha: 0, y: 12 });
      gsap.set(DV, { autoAlpha: 0 });
      [0, 1, 2].forEach((i) =>
        [0, 1, 2].forEach((k) => gsap.set("#bd-g" + i + "o" + k, { autoAlpha: 0 })));
      [0, 1, 2].forEach((i) => {
        gsap.set("#bd-gr" + i, { autoAlpha: 0 });
        gsap.set("#bd-gq" + i, { autoAlpha: 0 });
        gsap.set("#bd-g" + i, { autoAlpha: 0, y: 40 });
        gsap.set("#bd-g" + i + "l", { autoAlpha: 0 });
        gsap.set("#bd-g" + i + "n", { autoAlpha: 0 });
      });

      // ---- PHASE /table. The distinction in ONE frame: the table stays, the answer does
      // not, and the boundary is intact the whole time. That is what makes the wording
      // reassuring and wrong.
      tl.to("#bd-t-bnd", { autoAlpha: 1, duration: 0.6 }, AT_RESID);
      tl.to("#bd-t-tab", { autoAlpha: 1, duration: 0.45 }, AT_RESID + 0.25);
      tl.to("#bd-table", { autoAlpha: 1, y: 0, duration: 0.6 }, AT_RESID + 0.4);
      // Keep the wait alive without MOVING the table: its stillness is the claim this
      // phase makes, so the rows shimmer in opacity rather than translating, and the
      // boundary tab drifts. Before this, 2.73s passed with nothing in motion between
      // the table landing and the query arriving (lint: motion_frozen, 2.5s ceiling).
      document.querySelectorAll("#bd-table .bd-trow").forEach(function (r, i) {
        tl.to(r, { opacity: 0.72, duration: 0.95, ease: "sine.inOut",
                   yoyo: true, repeat: 3 }, AT_RESID + 0.9 + i * 0.13);
      });
      tl.to("#bd-t-tab", { y: "-=3", duration: 1.2, ease: "sine.inOut",
                           yoyo: true, repeat: 3 }, AT_RESID + 1.0);
      tl.to("#bd-qip", { autoAlpha: 1, duration: 0.45 }, AT_QIP);
      tl.to(QP, { autoAlpha: 1, duration: 0.2 }, AT_QIP + 0.3);
      tl.to(QP, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, AT_QIP + 0.3);
      // the table is spotlit and does NOT move - a marker confirms it
      tl.to("#bd-table", { borderColor: "#00B563", duration: 0.5 }, AT_TABLE);
      tl.to("#bd-table", { boxShadow: "0 0 30px rgba(0,181,99,.4)", duration: 0.5 }, AT_TABLE);
      tl.to("#bd-table", { borderColor: "#5E719F", boxShadow: "none", duration: 0.7 }, AT_TABLE + 1.3);
      // the RESULTS detach and travel OUT across the boundary, which stays intact
      tl.to("#bd-res", { autoAlpha: 1, duration: 0.4 }, AT_ANSWER - 0.5);
      tl.to("#bd-reslab", { autoAlpha: 1, duration: 0.4 }, AT_ANSWER - 0.25);
      tl.to("#bd-res", { x: 420, duration: 1.5, ease: "power1.inOut" }, AT_ANSWER);
      tl.to("#bd-reslab", { x: 420, duration: 1.5, ease: "power1.inOut" }, AT_ANSWER);
      tl.to("#bd-t-bnd", { borderColor: "#7287B5", duration: 0.4, yoyo: true, repeat: 1 }, AT_ANSWER + 0.6);

      // ---- PHASE /hybrid. The index is DERIVED and it TRAVELS. The documents' own state
      // is left UNRESOLVED (grammar rule 6): they sit in the neutral gap between the two
      // boundaries and NEVER move, because "the source documents stay with you" is our
      // inference from the word "only", not something Progress has stated.
      //
      // The earlier version of this phase settled them inside the customer boundary with
      // the record store's weight-and-stay gesture. That gesture IS the assertion, so it
      // is gone - not softened, gone. Do not reinstate any movement here: no drift, no
      // lean, no settle. A direction is a claim.
      // THE OUTGOING PHASE CLEARS AFTER THE INCOMING ONE ARRIVES, NEVER BEFORE.
      // Clearing first leaves a bare stage at the handover - measured on 9 Oct 2026:
      // eight of fifteen shot boundaries fell below the populated band and three
      // were completely bare. No opening measure can see it, because the blank is in
      // the OUTGOING shot's tail and openings are sampled from the next shot's start.
      tl.to("#bd-tablephase", { autoAlpha: 0, duration: 0.6 }, AT_HYBRID + 0.25);
      tl.to(QP, { autoAlpha: 0, duration: 0.4 }, AT_HYBRID - 0.5);
      tl.to("#bd-hybridphase", { autoAlpha: 1, duration: 0.5 }, AT_HYBRID);
      tl.fromTo("#bd-h-bnd1", { scaleX: 0.8, transformOrigin: "0% 50%" },
                { scaleX: 1, duration: 0.7, ease: "power3.out" }, AT_HYBRID + 0.2);
      // AT_STAY is now where the UNRESOLVED mark lands, not where the documents settle.
      tl.to("#bd-corpus-q", { autoAlpha: 1, scale: 1, duration: 0.5,
                              ease: "back.out(1.7)" }, AT_UNRESOLVED);
      tl.to("#bd-corpus-qlab", { autoAlpha: 1, duration: 0.45 }, AT_NOTTOLD);
      // "built from them": the index forms OUT of the documents. The derivation is real
      // and stays drawn, which is what keeps the shot informative rather than merely
      // blank - something genuinely built from them still draws from them.
      tl.set("#bd-idx", { left: 870, top: 640 }, AT_BUILT - 0.01);
      tl.fromTo("#bd-idx", { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%" },
                { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power3.out" }, AT_BUILT);
      tl.to(DV, { autoAlpha: 0.8, duration: 0.4 }, AT_BUILT + 0.5);
      // the derivation DRAWS ON from the documents toward the index, at the moment the
      // narration says the index is built from them. This is the motion the marching
      // ants were standing in for, and it happens on the right word.
      tl.fromTo(DV, { strokeDashoffset: DVL },
                { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, AT_BUILT + 0.2);
      // "rests in Progress's cloud": it TRAVELS across and SETTLES with weight
      tl.to("#bd-idx", { x: 320, y: -40, duration: 1.4, ease: "power1.inOut" }, AT_RESTS);
      tl.to("#bd-idx", { y: "-=26", duration: 0.3, ease: "power2.in" }, AT_RESTS + 1.4);
      tl.to("#bd-idx", { y: "+=26", duration: 0.5, ease: "power3.out" }, AT_RESTS + 1.7);
      tl.fromTo("#bd-inf", { autoAlpha: 0, x: 560, y: -40, scale: 0.6 },
                { autoAlpha: 1, x: 560, y: -40, scale: 1, duration: 0.6 }, AT_RESTS + 0.9);
      tl.to("#bd-date", { autoAlpha: 1, y: 0, duration: 0.5 }, AT_OCT);
      tl.to("#bd-date", { color: "#9FB0D0", duration: 0.5 }, AT_NOPUB);
      // the gap between "has not told us" and the date strip ran 3.27s static. The
      // index breathes and the question mark pulses - both allowed to move. The
      // derivation line USED to march here; that march was a dasharray, and a dashed
      // line is never decoration (grammar rule 2). Its motion moved to a draw-on at
      // AT_BUILT, which is where the beat actually is.
      tl.to("#bd-idx", { y: "-=5", duration: 1.25, ease: "sine.inOut",
                         yoyo: true, repeat: 5 }, AT_NOTTOLD + 0.2);
      tl.to("#bd-corpus-q", { opacity: 0.7, duration: 1.15, ease: "sine.inOut",
                              yoyo: true, repeat: 5 }, AT_NOTTOLD + 0.1);

      // ---- PHASE /notclaimed. One ghost per phrase, each taking the NOT BUILT
      // outline, then all three pushed decisively off frame right.
      // Clear the hybrid furniture to ZERO, not to 0.22. Dimming left the Inference
      // card sitting on top of the third ghost panel, so "Air gapped" was overprinted
      // by "Inference" - debris over a load-bearing label, and the same class of defect
      // as a verdict faded to 0.35 instead of cleared. The DATE STRIP stays, because it
      // qualifies what this whole act claims.
      ["#bd-h-tab0", "#bd-h-bnd0", "#bd-h-tab1", "#bd-h-bnd1", "#bd-corpus",
       "#bd-corpus-q", "#bd-corpus-qlab", "#bd-idx", "#bd-inf",
       "#bd-h-app", "#bd-h-applab"].forEach(function (id) {
        tl.to(id, { autoAlpha: 0, duration: 0.55 }, AT_NOT0 - 0.45);
      });
      tl.to(DV, { autoAlpha: 0, duration: 0.5 }, AT_NOT0 - 0.45);
      tl.to("#bd-notclaimed", { autoAlpha: 1, duration: 0.3 }, AT_NOT0 - 0.3);
      // the set exists from the start of the phase, dim; each member LIGHTS as the
      // narration names it. See the note above the phase for why.
      [0, 1, 2].forEach(function (i) {
        tl.to("#bd-g" + i, { autoAlpha: 0.14, y: 0, duration: 0.5 },
              AT_NOT0 - 0.25 + i * 0.08);
        tl.to("#bd-gq" + i, { autoAlpha: 0.3, duration: 0.5 },
              AT_NOT0 - 0.25 + i * 0.08);
        tl.to("#bd-gr" + i, { autoAlpha: 0.3, duration: 0.5 },
              AT_NOT0 - 0.25 + i * 0.08);
      });
      [AT_NOT0, AT_NOT1, AT_NOT2].forEach((at, i) => {
        tl.to("#bd-g" + i, { autoAlpha: 0.35, y: 0, duration: 0.55 }, at);
        tl.to("#bd-gr" + i, { autoAlpha: 0.75, duration: 0.55 }, at);
        tl.to("#bd-gq" + i, { autoAlpha: 1, duration: 0.55 }, at);
        tl.to("#bd-g" + i + "l", { autoAlpha: 1, duration: 0.4 }, at + 0.2);
        tl.to("#bd-g" + i + "n", { autoAlpha: 1, duration: 0.4 }, at + 0.38);
        // the objects arrive WITH their panel. They are brighter than the 0.42 panel
        // wash on purpose, for the same reason .bd-ghostlab is: an architect has to be
        // able to READ what the mode would have held.
        [0, 1, 2].forEach(function (k) {
          tl.to("#bd-g" + i + "o" + k, { autoAlpha: 1, duration: 0.5 }, at + 0.1 + k * 0.1);
        });
      });
      // NO push-off. The three ghosts rise and HOLD to the end of the shot.
      //
      // Two reasons, and the first is measured. With the push starting at AT_NOT2+0.7,
      // ghost 1 was legible for 4.1s and ghost 3 for about 0.5s - the third named
      // absence was gone before a viewer could read it, which is exactly the one an
      // architect must not misremember. There is no room inside this shot to both hold
      // the third and push all three.
      //
      // The second reason is that the push was the wrong gesture anyway. It is borrowed
      // from body-of-knowledge, where it means "excluded from the corpus". Here the
      // three are not dismissed, they are NOT CLAIMED - and stated-and-held says that,
      // where swept-away says someone decided against them.
      [0, 1, 2].forEach(function (i) {
        tl.to("#bd-g" + i, { autoAlpha: 0.42, duration: 0.8, ease: "sine.inOut" },
              AT_NOT2 + 0.8 + i * 0.12);
        tl.to("#bd-gr" + i, { autoAlpha: 0.85, duration: 0.8, ease: "sine.inOut" },
              AT_NOT2 + 0.8 + i * 0.12);
      });

      // ---- PHASE /modes. HOST-DRIVEN and NOT rendered by sa-use-cases: see README.
      // Three panels, each filled with the same object set, so the difference between the
      // modes is WHERE the objects are and nothing else.
      tl.to("#bd-hybridphase", { autoAlpha: 0, duration: 0.5 }, AT_MODES - 0.4);
      tl.to(DV, { autoAlpha: 0, duration: 0.4 }, AT_MODES - 0.4);
      // THE MISSING CLEAR. #bd-notclaimed was shown at AT_NOT0 - 0.3 and never hidden
      // - exactly one timeline call touched it in the whole motif. /modes hid the
      // hybrid phase and the derivation line and left the ghosts standing, so all
      // three NOT BUILT panels sat on top of the three mode panels for the entire
      // shot, and the private-cloud label collided with the ghost "Offline" label.
      // One cause, one line. Same shape as the split-parent legend in m-jy.
      // This fires at AT_MODES - 0.4 = 33.1s, AFTER sa-use-cases has finished with
      // this motif, so it cannot affect that film.
      // SPLIT PARENT, THE SECOND INSTANCE OF THE SAME BUG IN THIS LIBRARY. The ghost
      // panels' WORDS live in the #bd-notclaimed div; their NOT BUILT OUTLINES
      // are SVG <rect> elements in the svg layer, outside that div entirely. Clearing
      // the div hid the labels and left three dashed rectangles standing over the mode
      // panels. Identical in shape to m-jy's legend, where the text was dismissed and
      // the stroke swatches were orphaned - the words read as "the thing", so the
      // artwork is the half nobody clears.
      // FOUND BY: querying every element for stroke-dasharray. An earlier query walked
      // `div` only, reported zero, and I nearly trusted it over my own eyes - a
      // denominator failure, not a clean result.
      // bd-gq0/1/2 ADDED TO THIS LIST 9 Oct 2026 - THE THIRD INSTANCE OF THE SPLIT
      // PARENT IN THIS ONE FILE. The rule-6 question marks over the three ghost panels
      // were added to the SVG layer, not to #bd-notclaimed, so clearing the div left
      // three "?" glyphs standing over the /modes panels: one of them landed on top of
      // the shared corpus label and read as "in?any mode". Same shape as the ghost
      // OUTLINES before them and as m-jy's orphaned legend swatches. The lesson the
      // other two did not teach: when you add an element to a phase, add it to that
      // phase's CLEAR in the same edit, and if it cannot live in the phase's own
      // parent, that is the reason it will be forgotten.
      ["#bd-notclaimed", "#bd-gr0", "#bd-gr1", "#bd-gr2",
       "#bd-gq0", "#bd-gq1", "#bd-gq2"].forEach(function (id) {
        tl.to(id, { autoAlpha: 0, duration: 0.4 }, AT_MODES - 0.4);
      });
      tl.to("#bd-modesphase", { autoAlpha: 1, duration: 0.45 }, AT_MODES);
      // GRAMMAR RULE 7, same correction film-sa-usecases made to /notclaimed. The three
      // panels used to be CREATED one at a time (autoAlpha 0 -> 1 with a scaleX arrival,
      // staggered 0.5s apart), so this shot opened on a bare stage: measured structure
      // 0.0166 at +0.1s and 0.0223 at +0.4s against a 0.05 floor, near-bare for about
      // 0.6s at the top of the beat that says where the product can live.
      // Now all three REST from AT_MODES and the stagger LIGHTS them in turn. The scaleX
      // arrival is gone deliberately: a panel already on screen cannot arrive. The
      // difference between the three modes is WHERE the objects are, and that argument
      // is easier to read when all three frames are present to be compared.
      ["#bd-m0", "#bd-m1", "#bd-m2"].forEach(function (id) {
        tl.to(id, { autoAlpha: 0.3, duration: 0.4 }, AT_MODES);
      });
      [["#bd-m0", "#bd-m0-tab"],
       ["#bd-m1", "#bd-m1-tab"],
       ["#bd-m2", "#bd-m2-tab"]].forEach(function (pair, i) {
        tl.to(pair[0], { autoAlpha: 1, duration: 0.6 }, AT_MODES + 0.1 + i * 0.5);
        tl.to(pair[1], { autoAlpha: 1, duration: 0.4 }, AT_MODES + 0.3 + i * 0.5);
      });
      // the private-cloud panel carries its own UNRESOLVED marks (rule 6)
      tl.to("#bd-m1-q", { autoAlpha: 1, scale: 1, duration: 0.5,
                          ease: "back.out(1.7)" }, AT_MODES + 1.1);
      tl.to("#bd-m1-qlab", { autoAlpha: 1, duration: 0.45 }, AT_MODES + 1.35);
      // the title and the two stated captions rest with the phase and light with it
      ["#bd-modestitle", "#bd-m0-stated", "#bd-m2-stated"].forEach(function (id, k) {
        tl.set(id, { autoAlpha: 0 }, 0);
        tl.to(id, { autoAlpha: 0.26, duration: 0.4 }, AT_MODES);
        tl.to(id, { autoAlpha: 1, duration: 0.45 }, AT_MODES + 0.7 + k * 0.25);
      });

      // ---- the objects arrive per panel, so the eye reads WHERE before it reads what
      var MOBJ = [["#bd-m0-x", "#bd-m0-f"],
                  ["#bd-m1-x", "#bd-m1-f"],
                  ["#bd-m2-x", "#bd-m2-f"]];
      // GRAMMAR RULE 7 again, and the panels alone were NOT enough: resting three empty
      // rounded rectangles at 0.3 moved the opening only from structure 0.0166 to
      // 0.0227 against a 0.05 floor, because an empty bordered box is almost no
      // structure. The OBJECTS are what make this frame, and they are also the beat's
      // whole argument - the same three in all three modes, differing only in WHERE.
      // So they rest too, and the stagger lights them. The y:10 rise is gone for the
      // same reason the panels' scaleX arrival went: a thing already there cannot
      // arrive.
      // the shared corpus rests and lights with the panels, like every other object
      tl.set("#bd-m-corpus", { autoAlpha: 0 }, 0);
      tl.to("#bd-m-corpus", { autoAlpha: 0.26, duration: 0.4 }, AT_MODES);
      tl.to("#bd-m-corpus", { autoAlpha: 1, duration: 0.5 }, AT_MODES + 0.55);

      // EVERY SELECTOR USED ABOVE MUST RESOLVE. Removing the per-panel corpora left
      // five dead ids in these lists, and gsap on a missing selector is a SILENT no-op
      // - the exact shape of defect this file has been chasing all day. Throw instead.
      ["#bd-m0-x", "#bd-m0-f", "#bd-m1-x", "#bd-m1-f", "#bd-m2-x", "#bd-m2-f",
       "#bd-m-corpus", "#bd-m-corpusq", "#bd-m-corpuslab",
       "#bd-m1-fq", "#bd-m1-flab", "#bd-m1-q", "#bd-m1-qlab",
       "#bd-modestitle", "#bd-m0-stated", "#bd-m2-stated"].forEach(function (sel) {
        if (!document.querySelector(sel)) {
          throw new Error("m-bd /modes: selector " + sel + " resolves to nothing. A "
            + "tween on a missing element is a silent no-op, so this throws rather "
            + "than animating nothing.");
        }
      });

      MOBJ.forEach(function (grp, i) {
        grp.forEach(function (id, k) {
          tl.set(id, { autoAlpha: 0 }, 0);
          tl.to(id, { autoAlpha: 0.26, y: 0, duration: 0.4 }, AT_MODES);
          tl.to(id, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" },
                AT_MODES + 0.45 + i * 0.5 + k * 0.14);
        });
      });
      // the two UNRESOLVED objects get their question mark and label, never a boundary.
      //
      // THE MARK RESTS WITH THE OBJECT IT QUALIFIES, and that is a no-fake requirement
      // rather than a timing preference. Resting the objects from AT_MODES (above) left
      // these two sitting OUTSIDE their boundaries, fully drawn, unmarked, for 1.45s and
      // 2.45s - and grammar rule 6 is that an object whose state we were never told is
      // drawn outside every boundary CARRYING THE QUESTION MARK. Outside-and-unmarked
      // does not read as "unresolved", it reads as "definitely outside", which is a
      // claim about where inference runs and where the corpus is stored that nobody has
      // made. The mark now rests at the same moment and dimness as its object and
      // lights with it. There is no frame in which one of these objects is visible
      // without its mark.
      [["#bd-m1-fq", "#bd-m1-flab", AT_MODES + 1.45],
       ["#bd-m-corpusq", "#bd-m-corpuslab", AT_MODES + 0.9]].forEach(function (t) {
        tl.set(t[0], { autoAlpha: 0 }, 0);
        tl.set(t[1], { autoAlpha: 0 }, 0);
        tl.to(t[0], { autoAlpha: 0.26, duration: 0.4 }, AT_MODES);
        tl.to(t[1], { autoAlpha: 0.26, duration: 0.4 }, AT_MODES);
        tl.to(t[0], { autoAlpha: 1, duration: 0.4, ease: "back.out(1.7)" }, t[2]);
        tl.to(t[1], { autoAlpha: 1, duration: 0.4 }, t[2] + 0.18);
      });

      // ---- /modes was NEARLY FROZEN: measured median frame difference 0.0014 against
      // a film median of 0.1718, about one per cent, because every repeating gesture in
      // this motif is anchored to AT_RESID, AT_ANSWER, AT_NOTTOLD or AT_RESTS and all of
      // them have finished long before AT_MODES at 33.5s. The authored interiors now
      // supply the motion, as the note below always claimed they would.
      // CONFIRMED objects breathe. The two UNRESOLVED ones do NOT: rule 6 forbids
      // movement on an object whose state we were never told, because a direction is a
      // claim - and a breathe is a direction twice a second.
      ["#bd-m0-x", "#bd-m0-f", "#bd-m1-x",
       "#bd-m2-x", "#bd-m2-f"].forEach(function (id, k) {
        tl.to(id, { y: k % 2 ? -4 : 4, duration: 2.1, ease: "sine.inOut",
                    yoyo: true, repeat: 1 }, AT_MODES + 2.6 + k * 0.12);
      });
      // and the two question marks pulse, which is a change in opacity and not a
      // direction, so it is allowed on an unresolved object
      ["#bd-m1-fq", "#bd-m-corpusq"].forEach(function (id, k) {
        tl.to(id, { opacity: 0.7, duration: 1.2, ease: "sine.inOut", yoyo: true,
                    repeat: 1 }, AT_MODES + 3.0 + k * 0.4);
      });

      // ---- never still
      // NO stage breathe in this motif. A uniform scale on #bd-stage moves everything
      // inside it, including #bd-corpus - and grammar rule 6 forbids ANY movement on
      // an object whose state we were never told, because a direction is a claim. The
      // continuous sheen and the elements that ARE confirmed to be there carry the
      // motion instead. Do not reinstate a stage-wide transform here.
      // No light sweep. It existed to keep frozen windows alive and two
      // independent viewers read it as a rendering artefact; the authored
      // interiors supply the motion now.
      // NO drift on #bd-corpus: rule 6 forbids movement on an unresolved object,
      // so the stage keeps this shot alive instead and the documents hold still.
      tl.to("#bd-corpus-q", { opacity: 0.75, duration: 1.3, ease: "sine.inOut",
                              yoyo: true, repeat: 3 }, AT_RESTS + 0.4);

      window.__timelines["m-bd"] = tl;
    })();
