<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Motif: which pages, never what they wanted</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    /* A competent, ORDINARY analytics chart. The pain is that the chart is
       fine, so it must not be drawn as broken. */
    .bl-panel { position: absolute; left: 300px; top: 500px; width: 1320px; height: 420px;
      border-radius: 16px; background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.10); }
    .bl-head { position: absolute; left: 36px; top: 26px; width: 206px; height: 15px;
      border-radius: 4px; background: #8EA0C6; }
    .bl-head2 { position: absolute; left: 36px; top: 50px; width: 132px; height: 10px;
      border-radius: 3px; background: #5A6B93; }
    .bl-grid { position: absolute; left: 36px; height: 1px; width: 1248px;
      background: rgba(255,255,255,.09); }
    .bl-axis { position: absolute; left: 36px; top: 356px; width: 1248px; height: 2px;
      background: rgba(255,255,255,.22); }
    .bl-bar { position: absolute; width: 62px; border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, #4E6AA8 0%, #33497E 100%);
      transform-origin: bottom center; }
    .bl-lbl { position: absolute; height: 7px; border-radius: 2px; background: #46548099; }
    /* MUST READ: the counter and the question pills, 54px authored. */
    .bl-count { position: absolute; right: 336px; top: 526px; font-family: "ProgDisplay", sans-serif;
      font-size: 54px; font-weight: 600; color: #FFFFFF; text-align: right; }
    .bl-count small { display: block; font-family: "ProgText", sans-serif;
      font-size: 22px; font-weight: 400; color: #9FB0D0; letter-spacing: .04em; }
    .bl-q { position: absolute; height: 76px; padding: 0 32px; border-radius: 38px;
      border: 2px solid rgba(255,255,255,.34); background: rgba(0,22,85,.72);
      color: #fff; font-family: "ProgDisplay", sans-serif; font-size: 42px;
      font-weight: 500; line-height: 72px; white-space: nowrap; opacity: 0; }
    .bl-disc { position: absolute; width: 26px; height: 26px; border-radius: 50%;
      background: #FFFFFF; opacity: 0; }
    /* What is left behind: the ghost of a question nobody recorded. */
    .bl-ghost { position: absolute; height: 10px; border-radius: 5px;
      background: #FFFFFF; opacity: 0; }
    /* The INVERSION phase: the same dissolved questions, landing as rows on a
       list instead of being lost. The mechanism is the pain run backwards with
       the same objects. */
    .bl-list { position: absolute; left: 430px; top: 180px; width: 1060px; height: 580px;
      border-radius: 14px; border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.05); opacity: 0; }
    .bl-row { position: absolute; left: 36px; height: 34px; border-radius: 6px;
      background: rgba(255,255,255,.10); opacity: 0; }
    .bl-row i { position: absolute; left: 14px; top: 12px; height: 9px;
      border-radius: 3px; background: #BFD0EE; display: block; }
    .bl-mark { position: absolute; right: 16px; top: 9px; width: 58px; height: 16px;
      border-radius: 8px; background: #C9821F; opacity: 0; }
  </style>

  <div id="root" data-composition-id="m-bl" data-width="1920" data-height="1080"
       data-duration="14.0">
    <div class="bl-panel" id="bl-panel">
      <div class="bl-head"></div><div class="bl-head2"></div>
      <div class="bl-axis"></div>
    </div>
    <div class="bl-count" id="bl-count"><span id="bl-n">18,402</span>
      <small data-var-text="blCountLabel">PAGE VIEWS</small></div>
  </div>

  <script>
  (function () {
    const panel = document.getElementById("bl-panel");
    const root = document.getElementById("root");
    const PL = 300, PT = 500;
    // gridlines
    [86, 156, 226, 296].forEach((y) => {
      const g = document.createElement("div");
      g.className = "bl-grid"; g.style.top = y + "px"; panel.appendChild(g);
    });
    // twelve bars with their labels. Heights are ordinary, not dramatic.
    const H = [142, 96, 188, 118, 230, 160, 104, 206, 132, 174, 88, 150];
    const bars = [], TALL = 4;
    H.forEach((h, i) => {
      const x = 36 + i * 104;
      const b = document.createElement("div");
      b.className = "bl-bar"; b.id = "bl-bar" + i;
      b.style.left = x + "px"; b.style.top = (356 - h) + "px"; b.style.height = h + "px";
      panel.appendChild(b); bars.push(b);
      const l = document.createElement("div");
      l.className = "bl-lbl";
      l.style.left = x + "px"; l.style.top = "368px";
      l.style.width = (54 - (i % 4) * 7) + "px";
      panel.appendChild(l);
    });

    // Eleven real questions, under eight words each. These are the thing the
    // chart cannot hold, so they are authored as WORDS and not as shapes.
    const QS = ["Can I defer a semester?", "Is there parking on campus?",
      "What does student rent cost?", "Do you accept my diploma?",
      "When do applications close?", "Is placement paid?",
      "Can I study part time?", "What English score do I need?",
      "Is the library open late?", "How do I appeal a grade?",
      "Do you have a bus from Perth?"];
    const discs = [], pills = [], ghosts = [];
    const tallX = PL + 36 + TALL * 104 + 31;
    const tallTop = PT + 356 - H[TALL];
    QS.forEach((q, i) => {
      const d = document.createElement("div");
      d.className = "bl-disc"; d.id = "bl-d" + i;
      d.style.left = (tallX - 13) + "px"; d.style.top = (PT + 392) + "px";
      root.appendChild(d); discs.push(d);
      const p = document.createElement("div");
      p.className = "bl-q"; p.id = "bl-q" + i; p.textContent = q;
      root.appendChild(p);
      // measured after layout so the pill is centred on the bar it came from
      // Each pill gets its OWN lane. Alternating left and right of the bar,
      // stepping outward, so eleven of them can be in flight without ever
      // sitting on top of each other.
      const lane = Math.ceil(i / 2) * (i % 2 ? -1 : 1);
      p.dataset.lane = lane;
      p.style.left = Math.min(1880 - p.offsetWidth,
        Math.max(40, tallX - p.offsetWidth / 2 + lane * 118)) + "px";
      p.style.top = (tallTop - 112 - Math.abs(lane) * 18) + "px";
      pills.push(p);
      const g = document.createElement("div");
      g.className = "bl-ghost"; g.id = "bl-g" + i;
      g.style.left = (160 + (i * 149) % 1420) + "px";
      g.style.top = (70 + (i * 83) % 230) + "px";
      g.style.width = (120 + (i * 37) % 180) + "px";
      root.appendChild(g); ghosts.push(g);
    });

    const AT_WORK = 0.50, AT_FIRST = 2.00, AT_MANY = 3.80, AT_END = 5.80,
          AT_LIST = 8.60;   // the inversion phase the mechanism beat cuts from
    const tl = gsap.timeline({ paused: true,
      defaults: { duration: 0.6, ease: "power3.out" } });

    // 1. The chart is WORKING. Bars rise, the counter climbs. Nothing is broken.
    tl.from(bars, { scaleY: .82, duration: .5, stagger: .035, ease: "power2.out" },
            AT_WORK);
    const nEl = document.getElementById("bl-n");
    for (let s = 0; s <= 42; s++) {
      const v = Math.round(18402 + (23915 - 18402) * (s / 42));
      tl.set(nEl, { textContent: v.toLocaleString() }, AT_WORK + s * 0.2);
    }

    // 2. One visitor. One question. The pill DOES NOT ENTER THE CHART - it
    //    rises, thins and dissolves at the top of frame, and nothing records it.
    const arrive = (i, t) => {
      tl.fromTo(discs[i], { opacity: 0, y: 18 },
                { opacity: .95, y: 0, duration: .26 }, t);
      tl.fromTo(pills[i], { opacity: 0, y: 26, scale: .96 },
                { opacity: 1, y: 0, scale: 1, duration: .38 }, t + .18);
      tl.to(discs[i], { opacity: 0, duration: .3 }, t + .9);
      tl.to(pills[i], { y: -250, opacity: 0, scaleY: .7, filter: "blur(4px)",
                        duration: .95, ease: "power1.in" }, t + .62);
      tl.fromTo(ghosts[i], { opacity: 0 }, { opacity: .26, duration: .5 }, t + 1.2);
      tl.to(bars[TALL], { height: "+=7", duration: .3 }, t + .5);
    };
    arrive(0, AT_FIRST);
    // 3. Ten more, overlapping, while the chart keeps growing.
    for (let i = 1; i < QS.length; i++) arrive(i, AT_MANY + (i - 1) * 0.26);

    // 4. End state: the tallest, healthiest chart in the film, and the top half
    //    of the frame littered with the ghosts of questions nobody has.
    tl.to(bars, { scaleY: 1.06, duration: 1.2, ease: "sine.out" }, AT_END);
    tl.to(ghosts, { opacity: .34, duration: .9, stagger: .04 }, AT_END + .9);
    tl.to(panel, { y: -6, duration: 10.0, ease: "sine.inOut" }, 0);

    // ---- INVERSION: nothing is lost, and the refusals are the worklist ----
    const list = document.createElement("div");
    list.className = "bl-list"; list.id = "bl-list"; root.appendChild(list);
    const rows = [];
    for (let i = 0; i < QS.length; i++) {
      const r = document.createElement("div");
      r.className = "bl-row"; r.id = "bl-row" + i;
      r.style.top = (26 + i * 48) + "px"; r.style.width = "988px";
      const bar = document.createElement("i");
      bar.style.width = (300 + (i * 53) % 320) + "px"; r.appendChild(bar);
      if (i % 4 === 1) {
        const mk = document.createElement("div");
        mk.className = "bl-mark"; mk.id = "bl-mark" + i; r.appendChild(mk);
      }
      list.appendChild(r); rows.push(r);
    }
    // The chart RECEDES as the list arrives: the pain state hands over to the
    // mechanism state. Without this the list lands on top of the chart and the
    // frame is two things fighting rather than one becoming the other.
    tl.to(panel, { y: 300, opacity: .12, duration: .9, ease: "power2.inOut" }, AT_LIST);
    tl.to(document.getElementById("bl-count"),
          { opacity: .12, duration: .7 }, AT_LIST);
    tl.to(ghosts, { opacity: .5, duration: .4, stagger: .03 }, AT_LIST);
    tl.to(list, { opacity: 1, duration: .5 }, AT_LIST + .5);
    rows.forEach((r, i) => {
      const t = AT_LIST + .6 + i * 0.13;
      // each ghost DESCENDS into its row rather than fading - things travel
      tl.to(ghosts[i], { y: 340 + i * 46, x: 300, opacity: 0, duration: .55,
                         ease: "power2.in" }, t);
      tl.fromTo(r, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: .38 }, t + .3);
    });
    tl.to(".bl-mark", { opacity: 1, duration: .3, stagger: .12 }, AT_LIST + 2.4);
    tl.to(list, { y: -8, duration: 3.0, ease: "sine.inOut" }, AT_LIST + 2.6);

    window.__motifTimeline = tl;
    if (window.hyperframes && window.hyperframes.register) {
      window.hyperframes.register(tl);
    }
  })();
  </script>
</template>
</body>
</html>
